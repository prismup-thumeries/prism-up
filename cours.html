<!DOCTYPE html>
<html lang="fr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5QQ5K7E4S0"></script>

    function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19152a">
  <title>Planning des cours — Prism Up</title>
  <meta name="description" content="Planning des cours de danse Prism Up à Thumeries : enfants, ados, adultes. Cours d'essai gratuit.">
  <link rel="icon" type="image/png" href="images/logosite.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Prism Up">
  <meta property="og:title" content="Planning des cours — Prism Up">
  <meta property="og:description" content="Planning des cours de danse Prism Up à Thumeries : enfants, ados, adultes. Cours d'essai gratuit.">
  <meta property="og:image" content="https://prism-up.fr/images/logosite.png">
  <meta property="og:locale" content="fr_FR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cours">

<main class="wrap">

  <header class="page-head">
    <h1>Planning des cours</h1>
    <p>Saison <span id="saison"></span> · Touchez un cours pour voir la salle et l'essai gratuit.</p>
  </header>

  <div class="planning-tools">
    <div class="chips" id="filtres" role="group" aria-label="Filtrer par public">
      <button class="chip" data-public="tous" aria-pressed="true">Tous</button>
      <button class="chip" data-public="enfants" aria-pressed="false">Enfants</button>
      <button class="chip" data-public="ados" aria-pressed="false">Ados</button>
      <button class="chip" data-public="adultes" aria-pressed="false">Adultes</button>
      <button class="chip" data-public="option" aria-pressed="false">Approfondissement</button>
      <button class="chip" data-dispo aria-pressed="false">Places dispo</button>
    </div>
    <div class="segmented day-tabs" id="jours" role="tablist" aria-label="Jour"></div>
  </div>

  <div class="week by-day" id="planning"></div>

  <section class="section">
    <h2 class="section-title">Tarifs</h2>
    <div class="info-strip">
      <div><b id="prix-principal"></b><span>par cours, pour la saison</span></div>
      <div><b id="prix-option"></b><span>option approfondissement</span></div>
      <div><b>Gratuit</b><span>1er cours d'essai</span></div>
    </div>
    <div class="btn-row" style="margin-top:14px">
      <a class="btn btn-primary" id="btn-adhesion" target="_blank" rel="noopener">S'inscrire sur HelloAsso</a>
      <a class="btn btn-ghost" href="rejoindre.html#contact">Une question ?</a>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Questions fréquentes</h2>
    <div class="faq" id="faq"></div>
  </section>

</main>

<script src="events.js"></script>
<script src="cours.js"></script>
<script src="js/main.js"></script>
<script>
  const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  const joursAvecCours = JOURS.filter(j => COURS.some(c => c.jour === j));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const prixDe = c => c.public === "option" ? `+${TARIFS_COURS.option} €` : `${TARIFS_COURS.principal} €`;

  let filtrePublic = "tous";
  let filtreDispo = false;

  // Jour affiché par défaut sur mobile : aujourd'hui, sinon le prochain jour de cours
  const jourIndex = (new Date().getDay() + 6) % 7;
  let jourActif = joursAvecCours.find(j => JOURS.indexOf(j) >= jourIndex) || joursAvecCours[0];

  document.getElementById("saison").textContent = SAISON_COURS;
  document.getElementById("prix-principal").textContent = TARIFS_COURS.principal + " €";
  document.getElementById("prix-option").textContent = "+" + TARIFS_COURS.option + " €";
  document.getElementById("btn-adhesion").href = LIEN_ADHESION;

  document.getElementById("faq").innerHTML = FAQ_COURS.map(f =>
    `<details><summary>${f.q}</summary><div class="answer">${f.r}</div></details>`).join("");

  function dessinerPlanning() {
    const planning = document.getElementById("planning");
    planning.innerHTML = joursAvecCours.map(jour => {
      const cours = COURS.map((c, i) => ({ ...c, i })).filter(c => c.jour === jour);
      const salles = [...new Set(cours.map(c => SALLES[c.salle]?.nom))].join(" · ");
      return `
        <div class="day" data-jour="${jour}">
          <div class="day-head"><h2>${cap(jour)}</h2><p>${salles}</p></div>
          ${cours.map(c => `
            <button class="slot${c.complet ? " is-full" : ""}" data-i="${c.i}" data-public="${c.public}">
              <span class="time">${c.debut}<br class="br-m"><span class="muted"> – ${c.fin}</span></span>
              <span class="mid">
                <span class="name">${c.titre}</span>
                <span class="who" style="display:block">${c.detail || ""}</span>
              </span>
              <span class="tags">
                ${c.complet ? `<span class="pill pill-full">Complet</span>` : `<span class="pill pill-ok">Dispo</span>`}
                <span class="pill">${prixDe(c)}</span>
              </span>
            </button>`).join("")}
        </div>`;
    }).join("") + `<div class="empty" id="vide" hidden></div>`;

    planning.querySelectorAll(".slot").forEach(b => b.addEventListener("click", () => ouvrirCours(+b.dataset.i)));
    appliquerFiltres();
  }

  function dessinerOnglets() {
    document.getElementById("jours").innerHTML = joursAvecCours.map(j =>
      `<button role="tab" data-jour="${j}" aria-selected="${j === jourActif}">${cap(j).slice(0, 3)}</button>`).join("");
    document.querySelectorAll("#jours button").forEach(b => b.addEventListener("click", () => {
      jourActif = b.dataset.jour;
      dessinerOnglets();
      appliquerFiltres();
    }));
  }

  function appliquerFiltres() {
    // Un filtre "public" choisi : on montre toute la semaine (la liste est courte).
    const parJour = filtrePublic === "tous" && !filtreDispo;
    const week = document.getElementById("planning");
    week.classList.toggle("by-day", parJour);
    document.getElementById("jours").style.display = parJour ? "" : "none";

    let total = 0;
    week.querySelectorAll(".day").forEach(day => {
      let visibles = 0;
      day.querySelectorAll(".slot").forEach(s => {
        const c = COURS[+s.dataset.i];
        const ok = (filtrePublic === "tous" || c.public === filtrePublic) && (!filtreDispo || !c.complet);
        s.classList.toggle("is-hidden", !ok);
        if (ok) visibles++;
      });
      day.classList.toggle("is-hidden", visibles === 0);
      day.classList.toggle("is-active", day.dataset.jour === jourActif);
      total += visibles;
    });

    const vide = document.getElementById("vide");
    vide.hidden = total > 0;
    vide.innerHTML = `Aucun cours ne correspond. <a href="rejoindre.html#contact" style="color:var(--accent)">Contactez-nous</a> pour la liste d'attente.`;
  }

  document.querySelectorAll("#filtres .chip").forEach(chip => chip.addEventListener("click", () => {
    if (chip.hasAttribute("data-dispo")) {
      filtreDispo = !filtreDispo;
      chip.setAttribute("aria-pressed", filtreDispo);
    } else {
      filtrePublic = chip.dataset.public;
      document.querySelectorAll("#filtres .chip[data-public]").forEach(c => c.setAttribute("aria-pressed", c === chip));
    }
    appliquerFiltres();
  }));

  function ouvrirCours(i) {
    const c = COURS[i];
    const salle = SALLES[c.salle] || {};
    ouvrirFenetre(`
      <div class="sheet-body">
        <p class="eyebrow">${cap(c.jour)} · ${c.debut} – ${c.fin}</p>
        <h2 style="margin-top:6px">${c.titre}</h2>
        <p class="muted">${c.detail || ""}</p>
        <div class="facts">
          <div><span>${c.complet ? "🔴" : "🟢"}</span><span>${c.complet ? "Complet pour l'instant — liste d'attente possible" : "Places disponibles"}</span></div>
          <div><span>💶</span><span>${prixDe(c)}${c.public === "option" ? " (en plus d'un cours principal)" : " pour la saison"}</span></div>
          <div><span>🎁</span><span>Essai gratuit : ${c.essai}</span></div>
          <div><span>📍</span><span>${salle.nom}${salle.precision ? ` <span class="muted">· ${salle.precision}</span>` : ""}</span></div>
        </div>
        ${c.note ? `<p class="desc">${c.note}</p>` : ""}
        <div class="actions">
          ${c.complet
            ? `<a class="btn btn-primary btn-block" href="rejoindre.html#contact">Demander la liste d'attente</a>`
            : `<a class="btn btn-primary btn-block" href="${LIEN_ADHESION}" target="_blank" rel="noopener">S'inscrire sur HelloAsso</a>`}
          ${salle.maps ? `<a class="btn btn-ghost btn-block" href="${salle.maps}" target="_blank" rel="noopener">Itinéraire Google Maps</a>` : ""}
        </div>
      </div>`);
  }

  dessinerOnglets();
  dessinerPlanning();
</script>
</body>
</html>
