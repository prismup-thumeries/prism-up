<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19152a">
  <title>Événements — Prism Up</title>
  <meta name="description" content="Workshops, stages, sorties et galas de l'association de danse Prism Up à Thumeries.">
  <link rel="icon" type="image/png" href="images/logosite.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prism Up">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Prism Up">
  <meta property="og:title" content="Événements — Prism Up">
  <meta property="og:description" content="Workshops, stages, sorties et galas de l'association de danse Prism Up à Thumeries.">
  <meta property="og:image" content="https://prism-up.fr/images/logosite.png">
  <meta property="og:locale" content="fr_FR">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Thème clair/sombre appliqué avant l'affichage (évite un flash de couleur)
    try {
      document.documentElement.dataset.theme = localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="stylesheet" href="css/style.css?v=202611131528">
</head>
<body data-page="evenements">

<main class="wrap">

  <header class="page-head">
    <h1>Événements</h1>
    <p>Workshops, sorties et galas Prism Up.</p>
  </header>

  <div class="events-toolbar">
    <div class="segmented" role="tablist">
      <button role="tab" data-vue="avenir" aria-selected="true">À venir</button>
      <button role="tab" data-vue="passes" aria-selected="false">Passés</button>
    </div>
    <select class="season-select" id="saison" aria-label="Saison" hidden></select>
  </div>

  <div id="vue-avenir"></div>

  <button class="list-row agenda-row" id="abonnement" type="button">
    <span class="ico">📅</span>
    <span class="txt"><strong>Ne rate aucun événement</strong><span class="sub">Ajoute l'agenda Prism Up à ton téléphone</span></span>
    <span class="chev">›</span>
  </button>

  <div id="vue-passes" hidden>
    <section class="souvenirs-section" style="margin-bottom:22px">
      <div class="souvenirs" id="souvenirs"></div>
    </section>
    <div class="chips" id="types" style="margin-bottom:16px">
      <button class="chip" data-type="tous" aria-pressed="true">Tout</button>
      <button class="chip" data-type="evenement" aria-pressed="false">Événements</button>
      <button class="chip" data-type="stage" aria-pressed="false">Stages</button>
      <button class="chip" data-type="sortie" aria-pressed="false">Sorties</button>
    </div>
    <div class="ev-grid" id="grille-passes"></div>
  </div>

</main>

<script src="js/main.js?v=202611131528"></script>
<script>
chargerDonnees().then(() => {
  let typeActif = "tous";

  /* ─── À VENIR : le prochain en grand, les suivants en liste par mois ─── */
  function dessinerAVenir() {
    const zone = document.getElementById("vue-avenir");
    const liste = evenementsAVenir();
    if (!liste.length) {
      zone.innerHTML = `<div class="empty">Pas d'événement prévu pour l'instant.<br>Les souvenirs sont dans l'onglet « Passés » !</div>`;
      return;
    }
    const groupe = groupeVedette(liste);
    const suite = liste.filter(e => !groupe.includes(e));

    const parMois = {};
    suite.forEach(ev => {
      const cle = formaterDate(ev.date, { month: "long", year: "numeric" });
      (parMois[cle] = parMois[cle] || []).push(ev);
    });

    zone.innerHTML = blocVedette(liste, ev => `data-slug="${slug(ev)}"`) +
      Object.entries(parMois).map(([mois, evs]) => `
        <div class="month">
          <h3>${mois}</h3>
          <div class="list">
            ${evs.map(ev => `
              <button class="list-row ev-row" data-slug="${slug(ev)}">
                ${blocDate(ev)}
                <span class="txt"><strong>${ev.titre}</strong><span class="sub">${ev.badge ? ev.badge + " · " : ""}${typeDe(ev).label}${ev.heure ? " · " + ev.heure : ""}</span></span>
                <span class="chev">›</span>
              </button>`).join("")}
          </div>
        </div>`).join("");
  }

  /* ─── PASSÉS : rangés par saison (septembre → août) ─── */
  function dessinerSaisons() {
    const select = document.getElementById("saison");
    const saisons = [...new Set(evenementsPasses().map(saisonDe))];
    select.innerHTML = saisons.map(s => `<option value="${s}">${nomSaison(s)}</option>`).join("");
  }

  function dessinerPasses() {
    const saison = document.getElementById("saison").value;
    const liste = evenementsPasses()
      .filter(ev => saisonDe(ev) === saison)
      .filter(ev => typeActif === "tous" || (ev.type || "evenement") === typeActif);

    document.getElementById("grille-passes").innerHTML = liste.length
      ? liste.map(ev => {
          const couverture = { ...ev, affiche: (ev.photos && ev.photos[0]) || ev.affiche, cadrage: ev.photos?.length ? "center" : ev.cadrage };
          const nb = (ev.photos || []).length;
          return `
            <button class="ev-card" data-slug="${slug(ev)}">
              <div style="position:relative">
                ${visuel(couverture, { classe: "" })}
                ${nb ? `<span class="count">📷 ${nb}</span>` : ""}
              </div>
              <div class="body">
                <p class="eyebrow">${formaterDate(ev.date, { day: "numeric", month: "short" })} · ${typeDe(ev).label}</p>
                <h4>${ev.titre}</h4>
              </div>
            </button>`;
        }).join("")
      : `<div class="empty" style="grid-column:1/-1">Rien dans cette catégorie pour cette saison.</div>`;
  }

  /* ─── FICHE DÉTAILLÉE ─── */
  function urlVideo(url) {
    const id = url.includes("shorts/") ? url.split("shorts/")[1].split("?")[0]
      : url.includes("watch?v=") ? url.split("watch?v=")[1].split("&")[0]
      : url.includes("youtu.be/") ? url.split("youtu.be/")[1].split("?")[0] : "";
    return id ? `https://www.youtube-nocookie.com/embed/${id}` : url;
  }

  function ouvrirEvenement(s) {
    const ev = EVENEMENTS.find(e => slug(e) === s);
    if (!ev) return;
    const avenir = estAVenir(ev);
    history.replaceState(null, "", "#" + s);
    const photos = [...new Set([...(ev.photos || []), ...(ev.photos?.length && ev.affiche ? [ev.affiche] : [])])];
    const modePhotos = photos.length > 0;

    const widget = avenir && !ev.annule ? widgetHelloAsso(ev.lien) : null;
    const media = modePhotos ? carrouselHTML(photos)
      : ev.affiche ? visuel(ev, { classe: "ratio-45", entier: true })
      : ev.accroche ? visuel(ev, { classe: "ratio-169" }) : "";

    ouvrirFenetre(`
      <div class="sheet-media">
        ${media}
        <div class="sheet-body">
          <p class="eyebrow">${typeDe(ev).emoji} ${typeDe(ev).label}${avenir ? " · " + texteCompteRebours(ev.date, ev.date_fin) : ""}</p>
          ${ev.badge ? `<span class="pill pill-warm" style="margin-top:8px">${ev.badge}</span>` : ""}
          <h2 style="margin-top:6px">${ev.titre}</h2>
          ${ev.annule ? `<span class="pill pill-full">Annulé</span>` : ""}
          <div class="facts">
            <div><span>📅</span><span>${periode(ev)}</span></div>
            ${ev.heure ? `<div><span>🕒</span><span>${ev.heure}</span></div>` : ""}
            ${ev.lieu ? `<div><span>📍</span><span>${ev.lieu}</span></div>` : ""}
            ${(ev.tarifs || []).map(t => `<div><span>💶</span><span>${t.label} : <strong>${t.prix}</strong></span></div>`).join("")}
          </div>
          ${ev.infos?.length ? `<ul class="points-cles">${ev.infos.map(i => `<li><span>${i.icone || "•"}</span><span>${i.texte}</span></li>`).join("")}</ul>` : ""}
          ${ev.description ? `<p class="desc">${ev.description}</p>` : ""}
          ${ev.pour_qui?.length ? `
            <h3 class="sheet-sous-titre">Vous êtes…</h3>
            <div class="pour-qui">${ev.pour_qui.map(p => `<div><strong>${p.qui}</strong><span>${p.texte}</span></div>`).join("")}</div>` : ""}
          ${ev.video ? `<div id="video-zone"><button class="btn btn-ghost btn-block" style="margin-top:16px" data-video="${urlVideo(ev.video)}">▶ Voir la vidéo</button></div>` : ""}
          <div class="actions">
            ${widget
              ? `<div id="billetterie"><button class="btn btn-primary btn-block" data-billetterie>🎟️ ${ev.texteLien || "Réserver ma place"}</button>
                 <p class="small muted" style="text-align:center;margin-top:6px">Paiement sécurisé HelloAsso, directement ici · <a href="${ev.lien}" target="_blank" rel="noopener" style="color:var(--accent)">ouvrir sur HelloAsso ↗</a></p></div>`
              : ev.lien && avenir && !ev.annule ? `<a class="btn btn-primary btn-block" href="${ev.lien}" target="_blank" rel="noopener">${ev.texteLien || "Réserver ma place"}</a>` : ""}
            ${ev.instagram ? `<a class="btn btn-ghost btn-block" href="${ev.instagram}" target="_blank" rel="noopener">Voir la publication Instagram</a>` : ""}
            <div class="btn-row">
              ${avenir ? `<button class="btn btn-ghost" data-ics>Ajouter à l'agenda</button>` : ""}
              <button class="btn btn-ghost" data-partage>Partager</button>
            </div>
          </div>
        </div>
      </div>`, { large: !!ev.affiche && !modePhotos, photos: modePhotos, onClose: () => history.replaceState(null, "", location.pathname) });

    const sheet = document.querySelector("#sheet .sheet");
    if (modePhotos) activerCarrousel(sheet, photos);
    else sheet.querySelector(".frame.poster")?.addEventListener("click", () => ouvrirVisionneuse(ev.affiche));
    sheet.querySelector("[data-video]")?.addEventListener("click", e => {
      document.getElementById("video-zone").innerHTML =
        `<div class="video-box"><iframe src="${e.currentTarget.dataset.video}?autoplay=1" title="Vidéo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
    });
    // Billetterie HelloAsso intégrée : chargée seulement quand on clique (pas de cookies avant)
    sheet.querySelector("[data-billetterie]")?.addEventListener("click", () => {
      document.getElementById("billetterie").innerHTML = `
        <iframe class="ha-widget" title="Billetterie HelloAsso" src="${widget}" scrolling="auto"
          allow="payment 'self' https://paymenthub.helloassopay.com https://helloasso.com" allowtransparency="true"></iframe>
        <p class="small muted" style="text-align:center;margin-top:6px">Un souci d'affichage ? <a href="${ev.lien}" target="_blank" rel="noopener" style="color:var(--accent)">Réserver sur HelloAsso ↗</a></p>`;
    });
    sheet.querySelector("[data-ics]")?.addEventListener("click", () => telechargerAgenda(ev));
    sheet.querySelector("[data-partage]")?.addEventListener("click", e => partager(ev, e.currentTarget));
  }

  // Le widget HelloAsso indique sa hauteur : on agrandit le cadre pour éviter une double barre de défilement
  addEventListener("message", e => {
    if (!/^https:\/\/([a-z0-9-]+\.)?helloasso\.com$/.test(e.origin)) return;
    const h = e.data && parseFloat(e.data.height);
    const cadre = document.querySelector(".ha-widget");
    if (cadre && h > 300) cadre.style.height = h + "px";
  });

  // Lien HelloAsso d'un événement → adresse de son widget intégrable
  function widgetHelloAsso(lien) {
    const m = String(lien || "").match(/^https:\/\/www\.helloasso\.com\/associations\/[^/]+\/(evenements|adhesions|formulaires|boutiques|collectes)\/[^/?#]+/);
    return m ? m[0] + "/widget" : null;
  }

  /* Partage : menu natif du téléphone, sinon copie du lien */
  async function partager(ev, bouton) {
    const url = location.origin + location.pathname + "#" + slug(ev);
    if (navigator.share) {
      try { await navigator.share({ title: ev.titre, text: `${ev.titre} — ${formaterDate(ev.date)}`, url }); } catch (e) {}
      return;
    }
    try { await navigator.clipboard.writeText(url); bouton.textContent = "Lien copié ✓"; }
    catch (e) { prompt("Copiez ce lien :", url); }
  }

  /* Fichier .ics pour ajouter l'événement à l'agenda du téléphone */
  function telechargerAgenda(ev) {
    const jour = ev.date.replace(/-/g, "");
    const heures = (ev.heure || "").match(/(\d{1,2})h(\d{2})?/g) || [];
    const hhmm = h => { const [x, y] = h.split("h"); return x.padStart(2, "0") + (y || "00").padStart(2, "0") + "00"; };
    let dates;
    const jourFin = finDe(ev).replace(/-/g, "");
    if (heures.length) {
      const debut = hhmm(heures[0]);
      const fin = heures[1] ? hhmm(heures[1]) : ev.date_fin ? debut : String(Math.min(+debut.slice(0, 2) + 2, 23)).padStart(2, "0") + debut.slice(2);
      dates = `DTSTART;TZID=Europe/Paris:${jour}T${debut}\r\nDTEND;TZID=Europe/Paris:${jourFin}T${fin}`;
    } else {
      const lendemain = dateLocale(finDe(ev)); lendemain.setDate(lendemain.getDate() + 1);
      const l = `${lendemain.getFullYear()}${String(lendemain.getMonth() + 1).padStart(2, "0")}${String(lendemain.getDate()).padStart(2, "0")}`;
      dates = `DTSTART;VALUE=DATE:${jour}\r\nDTEND;VALUE=DATE:${l}`;
    }
    const echap = t => (t || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
    const ics = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Prism Up//FR", "BEGIN:VEVENT",
      `UID:${slug(ev)}@prism-up.fr`, dates,
      `SUMMARY:${echap(ev.titre)}`, `LOCATION:${echap(ev.lieu)}`,
      `DESCRIPTION:${echap(location.origin + location.pathname + "#" + slug(ev))}`,
      "END:VEVENT", "END:VCALENDAR"
    ].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
    a.download = slug(ev) + ".ics";
    a.click();
  }

  /* ─── NAVIGATION ─── */
  function changerVue(vue) {
    document.querySelectorAll("[data-vue]").forEach(b => b.setAttribute("aria-selected", b.dataset.vue === vue));
    document.getElementById("vue-avenir").hidden = vue !== "avenir";
    document.getElementById("vue-passes").hidden = vue !== "passes";
    document.getElementById("saison").hidden = vue !== "passes";
    document.getElementById("abonnement").hidden = vue !== "avenir";
    if (vue === "passes") dessinerPasses();
  }

  document.querySelectorAll("[data-vue]").forEach(b => b.addEventListener("click", () => changerVue(b.dataset.vue)));
  document.getElementById("saison").addEventListener("change", dessinerPasses);
  document.querySelectorAll("#types .chip").forEach(chip => chip.addEventListener("click", () => {
    typeActif = chip.dataset.type;
    document.querySelectorAll("#types .chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    dessinerPasses();
  }));
  document.querySelector("main").addEventListener("click", e => {
    const cible = e.target.closest("[data-slug]");
    if (cible) ouvrirEvenement(cible.dataset.slug);
  });

  dessinerAVenir();
  dessinerSaisons();

  // Lien direct vers un événement (ex : partagé sur Instagram)
  document.getElementById("abonnement").addEventListener("click", () =>
    ouvrirAgenda("evenements", "Agenda des événements", "Tous les stages, sorties et galas Prism Up dans ton agenda."));
  galerieSouvenirs(document.getElementById("souvenirs"));
  donneesGoogleEvenements();

  function ouvrirDepuisAncre() {
    if (location.hash === "#passes") { changerVue("passes"); return; }
    const ancre = decodeURIComponent(location.hash.slice(1));
    const cible = EVENEMENTS.find(e => slug(e) === ancre);
    if (!cible) return;
    if (!estAVenir(cible)) {
      document.getElementById("saison").value = saisonDe(cible);
      changerVue("passes");
    }
    ouvrirEvenement(ancre);
  }
  ouvrirDepuisAncre();
  window.addEventListener("hashchange", ouvrirDepuisAncre);
});
</script>
</body>
</html>
